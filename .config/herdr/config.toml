onboarding = false

[theme]
name = "vesper"

[theme.custom]
surface_dim = "#3a2e23"

[ui]
agent_panel_sort = "priority"
sidebar_collapsed_mode = "hidden"
sidebar_width = 34

[ui.sidebar.agents]
rows = [["state_icon", { token = "$display", fg = "#ffffff", bold = true, dim = false }, { token = "agent", fg = "#a6adc8", dim = false }]]

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[update]
channel = "stable"

[experimental]
kitty_graphics = true
switch_ascii_input_source_in_prefix = true

[keys]
previous_agent = "prefix+shift+p"
next_agent = "prefix+shift+n"
rename_pane = "prefix+comma"
