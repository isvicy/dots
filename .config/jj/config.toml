#:schema https://docs.jj-vcs.dev/latest/config-schema.json

# Personal identity by default; conf.d/local.toml scopes the work one to ~/repos/work/.
[user]
name = "isvicy"
email = "isregistermail@gmail.com"

[colors]
# 关掉 diff 行内 token 的下划线（整行新增/删除时整行都会被划线，太吵）
"diff token" = { underline = false }

[aliases]
tidy = ["abandon", "immutable_heads().. & ~::working_copies()"]
